schema_version: 1
registry_id: series-interaction-decisions
status: accepted
updated_at: "2026-07-27"
canonical_for:
  - public series-detail popup navigation
  - series volume slider behavior
human_summary: ./series-interaction-decisions.md

principles:
  - id: motion_is_feedback
    rule: Motion communicates state or response; it is not decoration.
  - id: avoid_whole_detail_motion
    rule: Do not translate or fade the cover, text, and metadata as a group on volume changes.
  - id: gestures_are_scoped
    rule: Popup navigation and volume-strip gestures must never compete.
  - id: hidden_chrome_keeps_control
    rule: Hidden scrollbars must not remove scrolling or drag affordances.
  - id: reduced_motion_is_immediate
    rule: Reduced-motion users receive immediate state changes without inertial or decorative motion.

components:
  popup_navigation:
    source:
      component: BookDetailDialog
      file: src/main.tsx
    scope: dialog_except_series_volume_section
    input:
      pointer:
        horizontal_threshold_px: 48
        velocity_threshold_px_per_ms: 0.5
      trackpad:
        horizontal_delta_threshold_px: 48
        release_cooldown_ms: 260
    volume_change:
      cooldown_ms: 220
      content_translation: disabled
      boundary_feedback:
        enabled: true
        displacement_px: 10
        duration_ms: 110
        spring:
          stiffness: 420
          damping: 28
    scroll_return:
      target: top
      duration_ms:
        formula: clamp(scroll_top_px * 0.18, 220, 280)
        min: 220
        max: 280
      easing: ease_in_out_cubic
      interruption:
        pointer_down: cancel
        vertical_wheel: cancel
      reduced_motion: immediate

  navigation_arrows:
    source:
      component: SeriesNavigationArrows
      file: src/main.tsx
    icon:
      source: reicon
      names:
        previous: angles-left
        next: angles-right
      delivery: inline_svg
      size_px: 24
    hit_target_px: 44
    motion:
      enter_exit:
        duration_ms: 300
        type: spring
        bounce: 0
        horizontal_offset_px: 8
        blur_px: 4
      hover_offset_px: 3
      tap_scale: 0.96
    behavior:
      pointer_drag: excluded
      click: changes_adjacent_volume

  volume_slider:
    source:
      component: SeriesVolumeSlider
      file: src/main.tsx
    presentation:
      card_basis_px: 112
      cover_width_px: 110
      card_gap_px: 12
      visible_content: cover_only
      selected_indicator:
        color: brand_accent
        height_px: 2
        transition_ms: 220
    selection:
      trigger: click_unselected_cover
      drag_or_wheel_changes_volume: false
    gesture_scope: series_volume_section_only
    drag:
      activation_threshold_px: 8
      sample_window_ms: 120
      render: request_animation_frame
      inertia:
        max_velocity_px_per_ms: 1.6
        deceleration_px_per_ms2: 0.003
      edge_resistance:
        pointer_max_px: 42
        wheel_max_px: 28
    settling:
      target: nearest_card_offset
      duration_ms: 180
      easing: ease_out_cubic
      wheel_idle_before_settle_ms: 120
      reduced_motion: immediate
    native_scrollbars: hidden

  popup_scroll_chrome:
    source:
      selector: .dialog-content
      file: src/styles.css
    horizontal_scrollbar: hidden
    vertical_scrollbar: hidden
    scrolling: preserved

user_feedback:
  - id: narrow_navigation_scope
    discomfort: Popup volume swipes worked only at the far left and right edges.
    resolution: Expand popup navigation to every popup area except the series volume section.
  - id: gesture_collision
    discomfort: Slider drag and popup swipe could be interpreted as the same gesture.
    resolution: Exclude the series volume section from popup navigation and stop horizontal wheel propagation inside the slider.
  - id: noisy_volume_controls
    discomfort: Volume numbers, card borders, and slider buttons made the series list visually busy.
    resolution: Use cover-only cards with one green active underline and no list navigation buttons.
  - id: unclear_navigation_state
    discomfort: Users could not tell whether a first or last volume accepted another swipe.
    resolution: Give the detail stage a short directional boundary nudge.
  - id: motion_sickness_and_flicker
    discomfort: Whole-detail translation and fade transitions felt artificial, flickered, and risked motion sickness.
    resolution: Keep detail content stationary; retain only local indicators, arrow feedback, and boundary feedback.
  - id: stuttering_navigation
    discomfort: A long post-navigation lock made the interaction feel discontinuous.
    resolution: Use a 220 ms volume-change cooldown and keep all whole-detail transition motion disabled.
  - id: abrupt_top_return
    discomfort: Selecting a volume at the bottom of the popup jumped abruptly to the top.
    resolution: Return the popup scroll position with an interruptible 220-280 ms capped motion.
  - id: scrollbar_noise
    discomfort: Popup scrollbars added visual noise despite direct touchpad and drag input.
    resolution: Hide both popup scrollbars while preserving scroll behavior.

non_goals:
  - Do not reproduce the BEUI wheel picker's 3D drum visual.
  - Do not let slider drag or horizontal wheel select a different volume.
  - Do not reintroduce whole-detail cover and text movement during volume changes.
  - Do not add visible horizontal or vertical popup scrollbars.

verification:
  automated:
    command: npm run test:e2e
    passed: 21
    coverage:
      - series grouping and volume selection
      - popup and slider gesture isolation
      - slider snapping after drag
      - boundary feedback
      - smooth popup return to top
      - hidden popup scrollbars
  build:
    command: npm run build
    status: passed
